<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: auto;
            border: 1px solid #e1e1e1;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }

        h2 {
            color: #444;
            border-bottom: 2px solid #f1f1f1;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Hello!</h2>
    <p>Your email address has been used to register with raggy.</p>
    <p>If that is correct, please verify your email by clicking on the link below.</p>
    <hr>
    <p>{{ link }}</p>
    <hr>
    <p>You can also copy the link and paste it into your browser's address bar.</p>
    <p>Thank you for using raggy!</p>
</div>
</body>
</html>
